name: build
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar ELF e ISO
        run: |
          docker run --rm -v "$PWD":/src -w /src ps2dev/ps2dev:latest \
            sh -c "apk add --no-cache make xorriso && make && sh tools/make_iso.sh JARONA.ELF JARONA.ISO NTSC"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarona-ps2
          path: |
            JARONA.ELF
            JARONA.ISO
